<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Rectangular pulse and its generalized derivative</title>
<desc id="desc">A rectangular pulse between a and b. Its derivative is a positive impulse at a and a negative impulse at b.</desc>
<defs>
  <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EA580C"/></marker>
  <style>
    .axis{stroke:#374151;stroke-width:2}.grid{stroke:#E5E7EB;stroke-width:1}.signal{stroke:#2563EB;stroke-width:5;fill:none;stroke-linejoin:round}.impulse{stroke:#EA580C;stroke-width:5}.label{font:22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}.small{font:19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#6B7280}.head{font:bold 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.weight{font:bold 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#EA580C}
  </style>
</defs>
<rect width="960" height="620" fill="white"/>
<text x="70" y="50" class="head">Pulse:  p(t) = u(t − a) − u(t − b)</text>
<line x1="90" y1="210" x2="880" y2="210" class="axis"/><line x1="170" y1="80" x2="170" y2="255" class="axis"/>
<line x1="370" y1="85" x2="370" y2="245" class="grid"/><line x1="690" y1="85" x2="690" y2="245" class="grid"/>
<path d="M90 210 H370 V115 H690 V210 H880" class="signal"/>
<circle cx="370" cy="115" r="6" fill="#2563EB"/><circle cx="690" cy="210" r="6" fill="#2563EB"/>
<text x="359" y="242" class="label">a</text><text x="680" y="242" class="label">b</text><text x="142" y="122" class="label">1</text><text x="862" y="238" class="label">t</text>

<text x="70" y="340" class="head">Derivative:  Dp(t) = δ(t − a) − δ(t − b)</text>
<line x1="90" y1="495" x2="880" y2="495" class="axis"/><line x1="170" y1="370" x2="170" y2="570" class="axis"/>
<line x1="370" y1="375" x2="370" y2="555" class="grid"/><line x1="690" y1="375" x2="690" y2="555" class="grid"/>
<line x1="370" y1="495" x2="370" y2="405" class="impulse" marker-end="url(#arrowOrange)"/>
<line x1="690" y1="495" x2="690" y2="555" class="impulse" marker-end="url(#arrowOrange)"/>
<text x="386" y="416" class="weight">+1</text><text x="706" y="554" class="weight">−1</text>
<text x="359" y="528" class="label">a</text><text x="680" y="528" class="label">b</text><text x="862" y="523" class="label">t</text>
<text x="90" y="600" class="small">flat segment → slope 0 · jump → impulse weight = right − left</text>
</svg>

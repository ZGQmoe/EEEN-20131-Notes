<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
<title id="title">Ideal half-wave rectifier</title>
<desc id="desc">An ideal diode connects the input to the output node, with a resistor from output to ground.</desc>
<defs><style>
  .wire{stroke:#374151;stroke-width:4;fill:none;stroke-linecap:round}.diode{stroke:#EA580C;stroke-width:4;fill:#FFF7ED}.res{stroke:#2563EB;stroke-width:4;fill:none;stroke-linejoin:round}.node{fill:#111827}.ground{stroke:#374151;stroke-width:3}.head{font:bold 27px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.label{font:22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}.eq{font:24px Georgia,'Times New Roman',serif;fill:#111827}.note{font:19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#6B7280}
</style></defs>
<rect width="960" height="410" fill="white"/>
<text x="55" y="48" class="head">Ideal half-wave rectifier</text>
<text x="50" y="167" class="label">vᵢₙ(t)</text>
<path d="M125 160 H230" class="wire"/>
<path d="M230 125 L230 195 L318 160 Z" class="diode"/>
<line x1="318" y1="123" x2="318" y2="197" class="diode"/>
<path d="M318 160 H510" class="wire"/>
<circle cx="420" cy="160" r="6" class="node"/>
<text x="395" y="125" class="label">vₒᵤₜ(t)</text>
<path d="M420 160 V205 l-14 16 28 22 -28 22 28 22 -28 22 14 16 V340" class="res"/>
<text x="455" y="273" class="label">R</text>
<path d="M385 340 H455 M395 351 H445 M408 362 H432" class="ground"/>
<text x="600" y="160" class="eq">vₒᵤₜ(t) = max{0, vᵢₙ(t)}</text>
<text x="600" y="207" class="note">positive: conduct · negative: block</text>
<text x="600" y="244" class="note">memoryless · nonlinear</text>
</svg>

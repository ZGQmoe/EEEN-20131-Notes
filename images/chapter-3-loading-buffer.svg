<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc">
<title id="title">Two voltage dividers with loading and with a buffer</title>
<desc id="desc">The direct connection makes the second divider load the first. An ideal voltage follower isolates the stages.</desc>
<defs>
  <style>
    .wire{stroke:#374151;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.res{stroke:#2563EB;stroke-width:4;fill:none;stroke-linejoin:round}.op{stroke:#059669;stroke-width:4;fill:#ECFDF5}.node{fill:#111827}.ground{stroke:#374151;stroke-width:3}.head{font:bold 27px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.label{font:22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}.small{font:19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#6B7280}.warn{font:bold 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#EA580C}.ok{font:bold 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#059669}
  </style>
</defs>
<rect width="1100" height="690" fill="white"/>

<text x="55" y="52" class="head">Direct connection: S₂ loads S₁</text>
<text x="35" y="157" class="label">vᵢₙ</text>
<path d="M90 150 H150" class="wire"/>
<path d="M150 150 l15 -14 20 28 20 -28 20 28 20 -28 20 28 15 -14" class="res"/>
<text x="198" y="120" class="label">R₁</text>
<path d="M280 150 H410" class="wire"/>
<circle cx="345" cy="150" r="6" class="node"/>
<text x="325" y="120" class="label">v₁</text>
<path d="M345 150 V205 l-14 15 28 20 -28 20 28 20 -28 20 14 15 V345" class="res"/>
<text x="375" y="270" class="label">R₂</text>
<path d="M410 150 l15 -14 20 28 20 -28 20 28 20 -28 20 28 15 -14" class="res"/>
<text x="458" y="120" class="label">R₃</text>
<path d="M540 150 H720" class="wire"/>
<circle cx="620" cy="150" r="6" class="node"/>
<text x="600" y="120" class="label">vₒᵤₜ</text>
<path d="M620 150 V205 l-14 15 28 20 -28 20 28 20 -28 20 14 15 V345" class="res"/>
<text x="650" y="270" class="label">R₄</text>
<path d="M315 345 H375 M590 345 H650" class="ground"/>
<path d="M323 355 H367 M598 355 H642" class="ground"/>
<path d="M333 365 H357 M608 365 H632" class="ground"/>
<text x="760" y="145" class="warn">R₂ → R₂ ∥ (R₃ + R₄)</text>
<text x="760" y="180" class="small">The original S₁ mapping changes.</text>

<line x1="55" y1="395" x2="1045" y2="395" stroke="#E5E7EB" stroke-width="2"/>

<text x="55" y="442" class="head">Buffered connection: voltage follower isolates the stages</text>
<text x="35" y="547" class="label">vᵢₙ</text>
<path d="M90 540 H140" class="wire"/>
<path d="M140 540 l15 -14 20 28 20 -28 20 28 20 -28 20 28 15 -14" class="res"/>
<text x="188" y="510" class="label">R₁</text>
<path d="M270 540 H350" class="wire"/>
<circle cx="315" cy="540" r="6" class="node"/>
<text x="298" y="510" class="label">v₁</text>
<path d="M315 540 V580 l-12 12 24 17 -24 17 12 12 V650" class="res"/>
<text x="342" y="616" class="label">R₂</text>
<path d="M285 650 H345 M293 660 H337 M303 670 H327" class="ground"/>

<path d="M350 540 H415" class="wire"/>
<path d="M415 485 L415 595 L535 540 Z" class="op"/>
<text x="432" y="528" class="label">+</text>
<text x="432" y="574" class="label">−</text>
<path d="M535 540 H585 V610 H405 V568 H415" class="wire"/>
<text x="438" y="478" class="small">voltage follower</text>

<path d="M585 540 H625" class="wire"/>
<path d="M625 540 l15 -14 20 28 20 -28 20 28 20 -28 20 28 15 -14" class="res"/>
<text x="672" y="510" class="label">R₃</text>
<path d="M755 540 H900" class="wire"/>
<circle cx="820" cy="540" r="6" class="node"/>
<text x="797" y="510" class="label">vₒᵤₜ</text>
<path d="M820 540 V580 l-12 12 24 17 -24 17 12 12 V650" class="res"/>
<text x="848" y="616" class="label">R₄</text>
<path d="M790 650 H850 M798 660 H842 M808 670 H832" class="ground"/>
<text x="920" y="535" class="ok">Rᵢₙ → ∞</text>
<text x="920" y="570" class="ok">Rₒᵤₜ → 0</text>
<text x="920" y="605" class="ok">gain = 1</text>
</svg>

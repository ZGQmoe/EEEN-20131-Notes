<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Physical cascade, loading, and buffering</title>
<desc id="desc">Directly connecting two stages changes the first subsystem through loading. A voltage follower isolates the stages and restores the cascade model.</desc>
<defs>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/></marker>
  <style>
    .box{fill:#EFF6FF;stroke:#2563EB;stroke-width:3;rx:10}.buffer{fill:#ECFDF5;stroke:#059669;stroke-width:3;rx:10}.wire{stroke:#2563EB;stroke-width:4;fill:none;marker-end:url(#arrowBlue)}.dash{stroke:#EA580C;stroke-width:3;stroke-dasharray:10 8;fill:none}.head{font:bold 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.label{font:22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}.small{font:19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#6B7280}.warn{font:bold 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#EA580C}.ok{font:bold 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#059669}
  </style>
</defs>
<rect width="960" height="520" fill="white"/>

<text x="60" y="55" class="head">Direct connection: loading changes S₁</text>
<text x="55" y="145" class="label">vᵢₙ</text>
<path d="M105 137 H200" class="wire"/>
<rect x="205" y="95" width="170" height="84" class="box"/>
<text x="278" y="145" class="label">S₁</text>
<path d="M375 137 H520" class="wire"/>
<text x="430" y="117" class="label">v₁</text>
<rect x="525" y="95" width="170" height="84" class="box"/>
<text x="598" y="145" class="label">S₂</text>
<path d="M695 137 H840" class="wire"/>
<text x="850" y="145" class="label">y</text>
<path d="M610 184 C610 245,290 245,290 184" class="dash"/>
<text x="350" y="238" class="warn">S₂ loads S₁ → original mappings lost</text>

<line x1="60" y1="275" x2="900" y2="275" stroke="#E5E7EB" stroke-width="2"/>

<text x="60" y="325" class="head">Buffered connection: one-way interaction</text>
<text x="55" y="415" class="label">vᵢₙ</text>
<path d="M105 407 H190" class="wire"/>
<rect x="195" y="365" width="150" height="84" class="box"/>
<text x="258" y="415" class="label">S₁</text>
<path d="M345 407 H435" class="wire"/>
<rect x="440" y="365" width="190" height="84" class="buffer"/>
<text x="477" y="415" class="label">buffer</text>
<path d="M630 407 H710" class="wire"/>
<rect x="715" y="365" width="145" height="84" class="box"/>
<text x="775" y="415" class="label">S₂</text>
<path d="M860 407 H915" class="wire"/>
<text x="735" y="490" class="ok">Rᵢₙ → ∞ · Rₒᵤₜ → 0 · gain = 1</text>
<text x="60" y="490" class="small">Isolation preserves S₂ ∘ S₁.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Four system properties: set relationships</title>
  <desc id="desc">Left: memoryless systems are a subset of causal systems. Causal systems outside memoryless have memory, and noncausal systems also have memory. Right: linear and time-invariant systems overlap in LTI systems. The two panels are independent; no further containment is implied.</desc>
  <style>
    text{font:20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}
    .heading{font-size:25px;font-weight:600;fill:#111827}
    .label{font-size:22px;font-weight:600}
    .small{font-size:17px}
    .example{font-size:18px;fill:#4B5563}
  </style>
  <rect width="960" height="620" fill="white"/>
  <text x="40" y="42" class="heading">System properties: two independent relationships</text>
  <text x="42" y="90" class="label">Memory / Causality</text>
  <rect x="35" y="110" width="425" height="390" rx="8" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <text x="55" y="142" class="small">All systems</text>
  <ellipse cx="247" cy="295" rx="177" ry="144" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="247" y="190" text-anchor="middle" class="label">Causal</text>
  <ellipse cx="247" cy="277" rx="117" ry="65" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="247" y="261" text-anchor="middle" class="label">Memoryless</text>
  <text x="247" y="290" text-anchor="middle" class="small">Present only</text>
  <text x="247" y="316" text-anchor="middle" class="example">y(t) = 2x(t)</text>
  <text x="247" y="370" text-anchor="middle" class="small">Causal + memory</text>
  <text x="247" y="399" text-anchor="middle" class="example">y(t) = x(t - 1)</text>
  <text x="247" y="469" text-anchor="middle" class="small">Outside causal: noncausal + memory</text>
  <text x="490" y="90" class="label">Linearity / Time invariance</text>
  <rect x="485" y="110" width="440" height="390" rx="8" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <text x="505" y="142" class="small">All systems</text>
  <ellipse cx="640" cy="293" rx="132" ry="136" fill="#EFF6FF" fill-opacity=".7" stroke="#2563EB" stroke-width="2"/>
  <ellipse cx="773" cy="293" rx="132" ry="136" fill="#FFFBEB" fill-opacity=".7" stroke="#D97706" stroke-width="2"/>
  <text x="600" y="207" text-anchor="middle" class="label">Linear</text>
  <text x="810" y="207" text-anchor="middle" class="label">TI</text>
  <text x="572" y="294" text-anchor="middle" class="small">Linear / TV</text>
  <text x="572" y="323" text-anchor="middle" class="example">t x(t)</text>
  <text x="706" y="290" text-anchor="middle" class="label">LTI</text>
  <text x="706" y="321" text-anchor="middle" class="example">x'(t)</text>
  <text x="840" y="294" text-anchor="middle" class="small">TI / nonlinear</text>
  <text x="840" y="323" text-anchor="middle" class="example">sin(x(t))</text>
  <text x="705" y="469" text-anchor="middle" class="small">Outside both: e.g. y(t) = t [x(t)]²</text>
  <text x="40" y="543" class="label">Memoryless ⊂ Causal</text>
  <text x="490" y="543" class="label">LTI = Linear ∩ TI</text>
  <text x="40" y="587" class="small">No other inclusion implied. A system must pass each test separately.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
<title id="title">RC low-pass circuit</title>
<desc id="desc">A resistor connects the input to the output node; a capacitor connects the output node to ground.</desc>
<defs><style>
  .wire{stroke:#374151;stroke-width:4;fill:none;stroke-linecap:round}.res{stroke:#2563EB;stroke-width:4;fill:none;stroke-linejoin:round}.cap{stroke:#EA580C;stroke-width:5}.node{fill:#111827}.ground{stroke:#374151;stroke-width:3}.head{font:bold 27px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.label{font:22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}.eq{font:24px Georgia,'Times New Roman',serif;fill:#111827}.note{font:19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#6B7280}
</style></defs>
<rect width="960" height="410" fill="white"/>
<text x="55" y="48" class="head">RC circuit — output across C</text>
<text x="50" y="167" class="label">vᵢₙ(t)</text>
<path d="M125 160 H210" class="wire"/>
<path d="M210 160 l15 -14 22 28 22 -28 22 28 22 -28 22 28 15 -14" class="res"/>
<text x="272" y="125" class="label">R</text>
<path d="M350 160 H535" class="wire"/>
<circle cx="440" cy="160" r="6" class="node"/>
<text x="415" y="125" class="label">vₒᵤₜ(t)</text>
<path d="M440 160 V225" class="wire"/>
<line x1="405" y1="225" x2="475" y2="225" class="cap"/>
<line x1="405" y1="248" x2="475" y2="248" class="cap"/>
<path d="M440 248 V330" class="wire"/>
<text x="490" y="244" class="label">C</text>
<path d="M405 330 H475 M415 341 H465 M428 352 H452" class="ground"/>
<text x="600" y="160" class="eq">RC · dvₒᵤₜ/dt + vₒᵤₜ = vᵢₙ</text>
<text x="600" y="207" class="note">capacitor stores energy</text>
<text x="600" y="244" class="note">linear · has memory</text>
</svg>

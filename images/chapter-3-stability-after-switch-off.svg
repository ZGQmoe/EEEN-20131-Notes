<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Responses after a truncated input is switched off</title>
<desc id="desc">A stable response decays to zero, a marginally stable response remains bounded, and an unstable response grows without bound after the input is switched off.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
<title id="title">Piecewise signal and generalized derivative</title>
<desc id="desc">The original signal has linear pieces and jumps. Its derivative combines constant slopes and impulses whose weights equal the jumps.</desc>
<defs>
  <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EA580C"/></marker>
  <style>
    .axis{stroke:#374151;stroke-width:2}.grid{stroke:#E5E7EB;stroke-width:1}.signal{stroke:#2563EB;stroke-width:5;fill:none}.zero{stroke:#6B7280;stroke-width:3;fill:none}.jump{stroke:#EA580C;stroke-width:2.5;stroke-dasharray:7 6}.slope{stroke:#059669;stroke-width:5;fill:none}.impulse{stroke:#EA580C;stroke-width:5}.label{font:20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}.small{font:18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#6B7280}.head{font:bold 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.weight{font:bold 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#EA580C}
  </style>
</defs>
<rect width="980" height="720" fill="white"/>
<text x="65" y="48" class="head">Piecewise signal x(t)</text>
<line x1="70" y1="200" x2="910" y2="200" class="axis"/><line x1="490" y1="75" x2="490" y2="315" class="axis"/>
<line x1="280" y1="75" x2="280" y2="315" class="grid"/><line x1="700" y1="75" x2="700" y2="315" class="grid"/>
<path d="M70 200 H280" class="zero"/><path d="M280 300 L490 200" class="signal"/><path d="M490 100 L700 200" class="signal"/><path d="M700 200 H910" class="zero"/>
<line x1="280" y1="200" x2="280" y2="300" class="jump"/><line x1="490" y1="200" x2="490" y2="100" class="jump"/>
<circle cx="280" cy="300" r="6" fill="#2563EB"/><circle cx="490" cy="100" r="6" fill="#2563EB"/>
<circle cx="280" cy="200" r="7" fill="white" stroke="#EA580C" stroke-width="2.5"/><circle cx="490" cy="200" r="7" fill="white" stroke="#EA580C" stroke-width="2.5"/>
<text x="264" y="232" class="label">−2</text><text x="483" y="232" class="label">0</text><text x="694" y="232" class="label">2</text><text x="892" y="228" class="label">t</text>
<text x="245" y="330" class="small">jump −2</text><text x="505" y="105" class="small">jump +2</text>

<text x="65" y="390" class="head">Derivative: slopes + jumps</text>
<line x1="70" y1="555" x2="910" y2="555" class="axis"/><line x1="490" y1="420" x2="490" y2="675" class="axis"/>
<line x1="280" y1="420" x2="280" y2="675" class="grid"/><line x1="700" y1="420" x2="700" y2="675" class="grid"/>
<path d="M70 555 H280" class="zero"/><path d="M280 490 H490" class="slope"/><path d="M490 620 H700" class="slope"/><path d="M700 555 H910" class="zero"/>
<line x1="280" y1="555" x2="280" y2="655" class="impulse" marker-end="url(#arrowOrange)"/>
<line x1="490" y1="555" x2="490" y2="445" class="impulse" marker-end="url(#arrowOrange)"/>

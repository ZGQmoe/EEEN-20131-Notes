<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Rectifier with capacitor and load resistor</title>
<desc id="desc">An ideal diode feeds an output node with a capacitor and resistor in parallel to ground.</desc>
<defs><style>
  .wire{stroke:#374151;stroke-width:4;fill:none;stroke-linecap:round}.diode{stroke:#EA580C;stroke-width:4;fill:#FFF7ED}.res{stroke:#2563EB;stroke-width:4;fill:none;stroke-linejoin:round}.cap{stroke:#059669;stroke-width:5}.node{fill:#111827}.ground{stroke:#374151;stroke-width:3}.head{font:bold 27px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.label{font:22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}.note{font:19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#6B7280}
</style></defs>
<rect width="960" height="440" fill="white"/>
<text x="55" y="48" class="head">Rectifier + capacitor</text>
<text x="45" y="177" class="label">vᵢₙ(t)</text>
<path d="M120 170 H220" class="wire"/>
<path d="M220 135 L220 205 L308 170 Z" class="diode"/>
<line x1="308" y1="133" x2="308" y2="207" class="diode"/>
<path d="M308 170 H590" class="wire"/>
<circle cx="430" cy="170" r="6" class="node"/>
<text x="405" y="130" class="label">vₒᵤₜ(t)</text>
<path d="M395 170 V235" class="wire"/>
<line x1="360" y1="235" x2="430" y2="235" class="cap"/>
<line x1="360" y1="258" x2="430" y2="258" class="cap"/>
<path d="M395 258 V350" class="wire"/>
<text x="345" y="255" class="label">C</text>
<path d="M500 170 V210 l-14 16 28 22 -28 22 28 22 -28 22 14 16 V350" class="res"/>
<text x="535" y="278" class="label">R</text>
<path d="M360 350 H535 M380 361 H515 M410 372 H485" class="ground"/>
<text x="640" y="168" class="note">diode switching → nonlinear</text>
<text x="640" y="207" class="note">stored capacitor voltage → memory</text>
<text x="640" y="246" class="note">R provides a discharge path</text>
</svg>

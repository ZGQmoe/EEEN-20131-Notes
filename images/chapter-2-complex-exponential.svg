<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc">
<title id="title">Complex exponential spirals</title>
<desc id="desc">Three projected complex exponential trajectories. Negative sigma decays inward, zero sigma has constant radius, and positive sigma grows outward while omega controls rotation.</desc>

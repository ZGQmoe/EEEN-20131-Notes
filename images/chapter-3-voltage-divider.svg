<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Resistive voltage divider</title>
<desc id="desc">Input voltage is applied across series resistors R1 and R2; output is measured across R2.</desc>
<defs><style>
  .wire{stroke:#374151;stroke-width:4;fill:none;stroke-linecap:round}.res{stroke:#2563EB;stroke-width:4;fill:none;stroke-linejoin:round}.node{fill:#111827}.ground{stroke:#374151;stroke-width:3}.head{font:bold 27px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.label{font:22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151}.eq{font:24px Georgia,'Times New Roman',serif;fill:#111827}.note{font:19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#6B7280}
</style></defs>
<rect width="960" height="390" fill="white"/>
<text x="55" y="48" class="head">Resistive voltage divider</text>
<text x="55" y="157" class="label">vᵢₙ(t)</text>
<path d="M125 150 H220" class="wire"/>
<path d="M220 150 l15 -14 22 28 22 -28 22 28 22 -28 22 28 15 -14" class="res"/>
<text x="278" y="115" class="label">R₁</text>
<path d="M360 150 H520" class="wire"/>
<circle cx="440" cy="150" r="6" class="node"/>
<text x="420" y="115" class="label">vₒᵤₜ(t)</text>
<path d="M440 150 V195 l-14 16 28 22 -28 22 28 22 -28 22 14 16 V330" class="res"/>
<text x="475" y="263" class="label">R₂</text>
<path d="M405 330 H475 M415 341 H465 M428 352 H452" class="ground"/>
<text x="600" y="168" class="eq">vₒᵤₜ(t) = [R₂/(R₁ + R₂)] vᵢₙ(t)</text>
<text x="600" y="215" class="note">instantaneous proportional gain</text>
<text x="600" y="252" class="note">memoryless · linear</text>
</svg>
